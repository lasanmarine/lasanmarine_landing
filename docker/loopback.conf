# The site's URL is http://localhost:49731 (the host port in docker-compose.yml).
# Inside the container nothing listens there, so every request WordPress makes
# to itself — Simply Static's export crawl, WP-Cron, Site Health loopback —
# fails. Listening on the same port inside makes that URL work from both sides.
Listen 49731

<VirtualHost *:49731>
	DocumentRoot /var/www/html
	ErrorLog ${APACHE_LOG_DIR}/error.log
	CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
