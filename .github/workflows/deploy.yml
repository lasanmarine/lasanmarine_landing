name: Deploy Lasan Marine

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: [self-hosted, linux, x64, lasan-landing]
    steps:
      - uses: actions/checkout@v4

      - name: Backup and deploy
        env:
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          set -eu
          test -n "$DEPLOY_PATH"
          mkdir -p "$DEPLOY_PATH" "$DEPLOY_PATH/.backups"
          stamp=$(date +%Y%m%d-%H%M%S)
          if [ -f "$DEPLOY_PATH/wp-config.php" ] || [ -d "$DEPLOY_PATH/wp-content" ]; then
            tar -czf "$DEPLOY_PATH/.backups/site-$stamp.tgz" -C "$DEPLOY_PATH" --exclude=.backups .
          fi
          rsync -a --delete \
            --exclude='.git/' --exclude='wp-content/uploads/' --exclude='wp-content/cache/' \
            --exclude='wp-content/upgrade/' --exclude='node_modules/' --exclude='.backups/' \
            "$GITHUB_WORKSPACE/" "$DEPLOY_PATH/"
