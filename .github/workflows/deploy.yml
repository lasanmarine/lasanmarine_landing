name: Deploy Lasan Marine

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.2
        env:
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          script: |
            set -eu
            test -n "$DEPLOY_PATH"
            mkdir -p "$DEPLOY_PATH" "$DEPLOY_PATH/.backups"
            stamp=$(date +%Y%m%d-%H%M%S)
            if [ -f "$DEPLOY_PATH/wp-config.php" ] || [ -d "$DEPLOY_PATH/wp-content" ]; then
              tar -czf "$DEPLOY_PATH/.backups/site-$stamp.tgz" -C "$DEPLOY_PATH" --exclude=.backups .
            fi
            find "$DEPLOY_PATH" -mindepth 1 -maxdepth 1 ! -name .backups -exec rm -rf {} +

      - name: Upload source
        uses: burnett01/rsync-deployments@7.0.2
        with:
          switches: -avz --delete --exclude='.git/' --exclude='wp-content/uploads/' --exclude='wp-content/cache/' --exclude='wp-content/upgrade/' --exclude='node_modules/' --exclude='.backups/'
          path: ./
          remote_path: ${{ secrets.DEPLOY_PATH }}/
          remote_host: ${{ secrets.DEPLOY_HOST }}
          remote_user: ${{ secrets.DEPLOY_USER }}
          remote_key: ${{ secrets.DEPLOY_SSH_KEY }}
          remote_port: ${{ secrets.DEPLOY_PORT || 22 }}
